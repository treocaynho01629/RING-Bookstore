        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff;background-color:#ffffff;width:100%;">
            <tbody>
            <tr>
                <td style="border:0.5px solid lightgray;direction:ltr;font-size:0px;padding:32px 0;text-align:center;">

                            <tbody>
                            <tr>
                                <td align="left" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                                    <div style="font-family:Roboto, sans-serif;font-size:24px;font-weight:450;line-height:24px;
                                        text-align:left;color:#000000;" th:text="#{email.reset.title}"></div>
                                </td>
                            </tr>
                            <tr>
                                <td align="left" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                                    <div style="font-family:Roboto, sans-serif;font-size:18px;font-weight:450;line-height:24px;
                                        text-align:left;color:#000000;" th:text="#{email.reset.body(${username})}"></div>
                                </td>
                            </tr>
                            <tr>
                                <td align="left" style="font-size:0px;padding:10px 25px;word-break:break-word;">
                                    <div style="font-family:Roboto, sans-serif;font-size:14px;font-weight:400;line-height:24px;text-align:left;color:#000000;">
                                        <span th:text="#{email.reset.question}"></span>&nbsp;
                                        <a style="color: #63aee3" href="mailto:support@ringdoraz.io.vn" th:text="#{email.support}"></a>&nbsp;
                                        <span th:text="#{email.reset.support}"></span><br/><br/>
                                        <span th:text="#{email.experience}"></span>.<br />
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td style="font-size:0px;word-break:break-word;">
                                    <div style="height:16px;line-height:16px;">&#8202;</div>

                            </tr>
                            <tr>
                                <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">

                                    <div style="font-family:Roboto, sans-serif;font-size:14px;font-weight:400;line-height:24px;text-align:left;color:gray;">
